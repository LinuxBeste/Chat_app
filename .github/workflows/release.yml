          '''
          )
          patch_file(
              return_type,
              '''class ReturnType(
            private val converter: JSTypeConverter<*>
          ) {
          ''',
              '''class ReturnType(
            private val converter: JSTypeConverter<*>
          ) {
            constructor(klass: KClass<*>) : this(
              getDirectConverter(klass.java) ?: getIndirectConverter(klass.java, null)
