name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to checkout
        required: false
        default: master
        type: string

permissions:
  contents: write
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Lowercase repo
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - run: pnpm install
      - run: pnpm --filter server run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/server:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LOWER }}/server:latest

  android:
    needs: server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" 2>&1 || \
          echo "y" | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" 2>&1 || true
        shell: bash

      - run: pnpm install

      - name: Patch pika-gradle to skip plugin (compiler artifacts not published for 0.3.x)
        run: |
          find -L node_modules -path "*/expo-modules-core/expo-module-gradle-plugin/build.gradle.kts" -exec sed -i "s|implementation(\"io.github.lukmccall.pika:pika-gradle:0.3.2\")|// implementation(\"io.github.lukmccall.pika:pika-gradle:0.3.2\")|" {} +
          find -L node_modules -path "*/expo-modules-core/expo-module-gradle-plugin/src/main/kotlin/expo/modules/plugin/ProjectConfiguration.kt" -exec sh -c '
            sed -i "/^import io.github.lukmccall.pika/d" "$1"
            sed -i "/^internal fun Project.applyPikaPlugin() {/,/^}$/c\internal fun Project.applyPikaPlugin() = Unit" "$1"
            sed -i "/^internal fun Project.configurePika(shouldBeEnabled: Boolean = true) {/,/^}$/c\internal fun Project.configurePika(shouldBeEnabled: Boolean = true) = Unit" "$1"
          ' _ {} \;

      - name: Patch Expo Promise.kt for RN 0.79 Promise interface compat
        run: |
          find -L node_modules -path "*/expo-modules-core/android/src/main/java/expo/modules/kotlin/Promise.kt" -exec sh -c '
            sed -i "/override fun reject(code: String?/s/code: String?/code: String/g" "$1"
            sed -i "/throwable: Throwable?, userInfo: WritableMap?)/s/code: String/code: String?/" "$1"
          ' _ {} \;
          find -L node_modules -path "*/expo-modules-core/android/src/main/java/expo/modules/kotlin/KPromiseWrapper.kt" -exec sh -c '
            sed -i "s/bridgePromise.reject(code, message, cause)/bridgePromise.reject(code ?: \"\", message, cause)/" "$1"
          ' _ {} \;

      - name: Patch ReactStylesDiffMapBackingFieldAccessor for RN 0.79
        run: |
          find -L node_modules -path "*/expo-modules-core/android/src/main/java/com/facebook/react/uimanager/ReactStylesDiffMapBackingFieldAccessor.java" -exec sed -i "s/diffMap.internal_backingMap()/diffMap.mBackingMap/" {} \;

      - name: Fix @react-native/codegen componentsUtils.js corrupted TSStringKeyword case
        run: |
          python3 << 'PYEOF'
          import sys, os

          def patch_file(fn):
              with open(fn) as f:
                  c = f.read()

              old = (
                  '        return {\n'
                  '          type: "StringTypeAnnotation",\n'
                  '        };\n'
                  "    case 'TSNumberKeyword':\n"
                  '      throw new Error(\n'
                  '        `Cannot use "${type}" type annotation for "${name}": must use a specific numeric type like Int32, Double, or Float`,\n'
                  '        return {\n'
                  '          type: "StringTypeAnnotation",\n'
                  '        };\n'
                  '      );\n'
                  "    case 'TSFunctionType':\n"
                  '      throw new Error(\n'
                  '        return {\n'
                  '          type: "StringTypeAnnotation",\n'
                  '        };\n'
                  '        `Cannot use "${type}" type annotation for "${name}": must use a specific function type like BubblingEventHandler, or DirectEventHandler`,\n'
                  '      );'
              )

              new = (
                  "    case 'TSStringKeyword':\n"
                  '      return {\n'
                  '        type: "StringTypeAnnotation",\n'
                  '      };\n'
                  "    case 'TSNumberKeyword':\n"
                  '      throw new Error(\n'
                  '        `Cannot use "${type}" type annotation for "${name}": must use a specific numeric type like Int32, Double, or Float`,\n'
                  '      );\n'
                  "    case 'TSFunctionType':\n"
                  '      throw new Error(\n'
                  '        `Cannot use "${type}" type annotation for "${name}": must use a specific function type like BubblingEventHandler, or DirectEventHandler`,\n'
                  '      );'
              )

              if old in c:
                  c = c.replace(old, new)
                  with open(fn, 'w') as f:
                      f.write(c)
                  return True
              return False

          patched = 0
          for root, dirs, files in os.walk('node_modules'):
              for fn in files:
                  if fn == 'componentsUtils.js' and '/typescript/components/' in root:
                      if patch_file(os.path.join(root, fn)):
                          patched += 1

          if patched == 0:
              print('No files needed patching')
          else:
              print(f'Patched {patched} file(s)')
          PYEOF

      - name: Generate native projects
        run: npx expo prebuild --clean
        working-directory: client/mobile-app

      - name: Patch MainApplication.kt for RN 0.79 ReactApplication interface
        run: |
          python3 << 'PYEOF'
          fn = 'app/src/main/java/com/chatapp/mobile/MainApplication.kt'
          d = open(fn).read()
          changes = 0

          # Remove ReactNativeApplicationEntryPoint import (doesn't exist in RN 0.79)
          old_import = 'import com.facebook.react.ReactNativeApplicationEntryPoint.loadReactNative\n'
          if old_import in d:
            d = d.replace(old_import, '')
            changes += 1

          # If ReactNativeHost import is missing, add it after ReactApplication
          if 'import com.facebook.react.ReactNativeHost' not in d:
            d = d.replace(
              'import com.facebook.react.ReactApplication',
              'import com.facebook.react.ReactApplication\nimport com.facebook.react.ReactNativeHost')
            changes += 1

          # Add reactNativeHost property after the reactHost lazy block
          if 'override val reactNativeHost:' not in d:
            old_host = '  override val reactHost: ReactHost by lazy {'
            new_host = (
              '  override val reactNativeHost: ReactNativeHost = object : ReactNativeHost(this) {\n'
              '    override fun getUseDeveloperSupport(): Boolean = BuildConfig.DEBUG\n'
              '    override fun getPackages(): List<ReactPackage> = PackageList(this@MainApplication).packages\n'
              '  }\n\n'
              '  override val reactHost: ReactHost by lazy {')
            d = d.replace(old_host, new_host)
            changes += 1

          # Remove loadReactNative(this) call
          if 'loadReactNative(this)' in d:
            d = d.replace('    loadReactNative(this)\n', '')
            changes += 1

          # Add SoLoader import (required for DefaultNewArchitectureEntryPoint.load())
          if 'import com.facebook.soloader.SoLoader' not in d:
            d = d.replace(
              'import com.facebook.react.defaults.DefaultNewArchitectureEntryPoint',
              'import com.facebook.react.defaults.DefaultNewArchitectureEntryPoint\nimport com.facebook.soloader.SoLoader')
            changes += 1

          # Add SoLoader.init() and DefaultNewArchitectureEntryPoint.load() calls
          if 'SoLoader.init(this, false)' not in d:
            old_oncreate = '    ApplicationLifecycleDispatcher.onApplicationCreate(this)'
            new_oncreate = (
              '    SoLoader.init(this, false)\n'
              '    DefaultNewArchitectureEntryPoint.load()\n'
              '    ApplicationLifecycleDispatcher.onApplicationCreate(this)')
            d = d.replace(old_oncreate, new_oncreate)
            changes += 1

          if changes > 0:
            open(fn, 'w').write(d)
            print(f'Patched: {fn} ({changes} changes)')
          PYEOF
        working-directory: client/mobile-app/android

      - name: Strip ReactNativeFeatureFlagsCxxInterop from react-android AAR + create shadow
        run: |
          # Download the official react-android AAR from Maven Central
          curl -sL "https://repo1.maven.org/maven2/com/facebook/react/react-android/0.79.2/react-android-0.79.2-release.aar" \
            -o /tmp/react-android.aar

          # Extract, remove the offending class from classes.jar, repack
          rm -rf /tmp/aar_work
          mkdir -p /tmp/aar_work
          unzip -q /tmp/react-android.aar -d /tmp/aar_work
          # Only strip CxxInterop (CxxAccessor is still needed by ReactNativeFeatureFlags)
          zip -d /tmp/aar_work/classes.jar \
            'com/facebook/react/internal/featureflags/ReactNativeFeatureFlagsCxxInterop*' 2>/dev/null || true
          rm -f /tmp/react-android-patched.aar
          (cd /tmp/aar_work && zip -qr /tmp/react-android-patched.aar .)

          # Put it in the local Maven repo so Gradle picks it up before Maven Central
          mkdir -p ~/.m2/repository/com/facebook/react/react-android/0.79.2
          cp /tmp/react-android-patched.aar ~/.m2/repository/com/facebook/react/react-android/0.79.2/react-android-0.79.2.aar

          # Also copy POM (needed for transitive deps) – download from Maven Central
          curl -sL "https://repo1.maven.org/maven2/com/facebook/react/react-android/0.79.2/react-android-0.79.2.pom" \
            -o ~/.m2/repository/com/facebook/react/react-android/0.79.2/react-android-0.79.2.pom

          # Add local Maven repo to the root build.gradle's allprojects block so it's checked first
          sed -i '/^allprojects {/,/^}/s/    mavenCentral()/    mavenLocal()\n    mavenCentral()/' build.gradle

          # Create the shadow class in the app source (now it's the only copy)
          mkdir -p app/src/main/java/com/facebook/react/internal/featureflags
          python3 -u /dev/stdin <<'PYEOF'
          import os
          content = """package com.facebook.react.internal.featureflags

          import com.facebook.proguard.annotations.DoNotStrip
          import com.facebook.soloader.SoLoader

          @DoNotStrip
          public object ReactNativeFeatureFlagsCxxInterop {
            init {
              try {
                SoLoader.loadLibrary("react_featureflagsjni")
              } catch (e: UnsatisfiedLinkError) {
                SoLoader.loadLibrary("reactnative")
              }
            }

            @DoNotStrip @JvmStatic public external fun commonTestFlag(): Boolean
            @DoNotStrip @JvmStatic public external fun disableMountItemReorderingAndroid(): Boolean
            @DoNotStrip @JvmStatic public external fun enableAccumulatedUpdatesInRawPropsAndroid(): Boolean
            @DoNotStrip @JvmStatic public external fun enableBridgelessArchitecture(): Boolean
            @DoNotStrip @JvmStatic public external fun enableCppPropsIteratorSetter(): Boolean
            @DoNotStrip @JvmStatic public external fun enableEagerRootViewAttachment(): Boolean
            @DoNotStrip @JvmStatic public external fun enableFabricLogs(): Boolean
            @DoNotStrip @JvmStatic public external fun enableFabricRenderer(): Boolean
            @DoNotStrip @JvmStatic public external fun enableIOSViewClipToPaddingBox(): Boolean
            @DoNotStrip @JvmStatic public external fun enableImagePrefetchingAndroid(): Boolean
            @DoNotStrip @JvmStatic public external fun enableJSRuntimeGCOnMemoryPressureOnIOS(): Boolean
            @DoNotStrip @JvmStatic public external fun enableLayoutAnimationsOnAndroid(): Boolean
            @DoNotStrip @JvmStatic public external fun enableLayoutAnimationsOnIOS(): Boolean
            @DoNotStrip @JvmStatic public external fun enableLongTaskAPI(): Boolean
            @DoNotStrip @JvmStatic public external fun enableNativeCSSParsing(): Boolean
            @DoNotStrip @JvmStatic public external fun enableNewBackgroundAndBorderDrawables(): Boolean
            @DoNotStrip @JvmStatic public external fun enablePreciseSchedulingForPremountItemsOnAndroid(): Boolean
            @DoNotStrip @JvmStatic public external fun enablePropsUpdateReconciliationAndroid(): Boolean
            @DoNotStrip @JvmStatic public external fun enableReportEventPaintTime(): Boolean
            @DoNotStrip @JvmStatic public external fun enableSynchronousStateUpdates(): Boolean
            @DoNotStrip @JvmStatic public external fun enableUIConsistency(): Boolean
            @DoNotStrip @JvmStatic public external fun enableViewCulling(): Boolean
            @DoNotStrip @JvmStatic public external fun enableViewRecycling(): Boolean
            @DoNotStrip @JvmStatic public external fun enableViewRecyclingForText(): Boolean
            @DoNotStrip @JvmStatic public external fun enableViewRecyclingForView(): Boolean
            @DoNotStrip @JvmStatic public external fun excludeYogaFromRawProps(): Boolean
            @DoNotStrip @JvmStatic public external fun fixDifferentiatorEmittingUpdatesWithWrongParentTag(): Boolean
            @DoNotStrip @JvmStatic public external fun fixMappingOfEventPrioritiesBetweenFabricAndReact(): Boolean
            @DoNotStrip @JvmStatic public external fun fixMountingCoordinatorReportedPendingTransactionsOnAndroid(): Boolean
            @DoNotStrip @JvmStatic public external fun fuseboxEnabledRelease(): Boolean
            @DoNotStrip @JvmStatic public external fun fuseboxNetworkInspectionEnabled(): Boolean
            @DoNotStrip @JvmStatic public external fun lazyAnimationCallbacks(): Boolean
            @DoNotStrip @JvmStatic public external fun removeTurboModuleManagerDelegateMutex(): Boolean
            @DoNotStrip @JvmStatic public external fun throwExceptionInsteadOfDeadlockOnTurboModuleSetupDuringSyncRenderIOS(): Boolean
            @DoNotStrip @JvmStatic public external fun traceTurboModulePromiseRejectionsOnAndroid(): Boolean
            @DoNotStrip @JvmStatic public external fun updateRuntimeShadowNodeReferencesOnCommit(): Boolean
            @DoNotStrip @JvmStatic public external fun useAlwaysAvailableJSErrorHandling(): Boolean
            @DoNotStrip @JvmStatic public external fun useEditTextStockAndroidFocusBehavior(): Boolean
            @DoNotStrip @JvmStatic public external fun useFabricInterop(): Boolean
            @DoNotStrip @JvmStatic public external fun useNativeViewConfigsInBridgelessMode(): Boolean
            @DoNotStrip @JvmStatic public external fun useOptimizedEventBatchingOnAndroid(): Boolean
            @DoNotStrip @JvmStatic public external fun useRawPropsJsiValue(): Boolean
            @DoNotStrip @JvmStatic public external fun useShadowNodeStateOnClone(): Boolean
            @DoNotStrip @JvmStatic public external fun useTurboModuleInterop(): Boolean
            @DoNotStrip @JvmStatic public external fun useTurboModules(): Boolean
            @DoNotStrip @JvmStatic public external fun override(provider: Any)
            @DoNotStrip @JvmStatic public external fun dangerouslyReset()
            @DoNotStrip @JvmStatic public external fun dangerouslyForceOverride(provider: Any): String?
          }
          """
          fn = "app/src/main/java/com/facebook/react/internal/featureflags/ReactNativeFeatureFlagsCxxInterop.kt"
          os.makedirs(os.path.dirname(fn), exist_ok=True)
          with open(fn, "w") as f:
            f.write(content)
          print("Created shadow:", fn)
          PYEOF
        working-directory: client/mobile-app/android

      - name: Pin Gradle version
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.12-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
        working-directory: client/mobile-app/android

      - name: Bypass Expo Kotlin version check
        run: |
          sed -i "s/^buildscript {/buildscript {\n    ext.kotlinVersion = '2.2.21'\n    ext.kspVersion = '2.2.21-2.0.5'/" build.gradle
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21')|" build.gradle
        working-directory: client/mobile-app/android

      - name: Fix Hermes compiler path
        run: |
          sed -i "s|require.resolve('hermes-compiler/package.json', { paths: \[require.resolve('react-native/package.json')\] })|require.resolve('react-native/package.json')|" app/build.gradle
          sed -i "s|getParentFile().getAbsolutePath() + \"/hermesc/|getParentFile().getAbsolutePath() + \"/sdks/hermesc/|" app/build.gradle
        working-directory: client/mobile-app/android

      - name: Pin androidx.core for compileSdk 35 compatibility
        run: |
          python3 << 'PYEOF'
          with open('app/build.gradle') as f:
              c = f.read()
          block = "configurations.all {\n    resolutionStrategy {\n        force 'androidx.core:core:1.15.0'\n        force 'androidx.core:core-ktx:1.15.0'\n    }\n}\n\n"
          c = c.replace('dependencies {', block + 'dependencies {', 1)
          with open('app/build.gradle', 'w') as f:
              f.write(c)
          PYEOF
        working-directory: client/mobile-app/android

      - name: Remove assetsPaths from configChanges (API 36+ flag incompatible with compileSdk 35)
        run: |
          sed -i 's/|assetsPaths//g' app/src/main/AndroidManifest.xml
        working-directory: client/mobile-app/android

      - name: Patch Expo log-box for RN 0.79 DevSupportManagerBase compatibility
        run: |
          cat > /tmp/patch_logbox.py << 'PYEOF'
          import sys
          fn = sys.argv[1]
          content = open(fn).read()
          changed = False

          OLD_IMPORT = 'import com.facebook.react.devsupport.interfaces.StackFrame'
          NEW_IMPORT = 'import com.facebook.react.bridge.JSBundleLoader\nimport com.facebook.react.devsupport.interfaces.DevSplitBundleCallback\nimport com.facebook.react.devsupport.interfaces.StackFrame'

          if 'import com.facebook.react.bridge.JSBundleLoader' not in content:
              content = content.replace(OLD_IMPORT, NEW_IMPORT)
              changed = True

          OLD_UNIQUE = '  override val uniqueTag: String\n    get() = "Bridgeless"'
          NEW_UNIQUE = '  override fun getUniqueTag(): String = "Bridgeless"'

          if 'override val uniqueTag: String' in content:
              content = content.replace(OLD_UNIQUE, NEW_UNIQUE)
              changed = True

          OLD_SHOW_JAVA = 'override fun showNewJavaError(message: String?, e: Throwable) {\n    showNewError(message, convertJavaStackTrace(e))\n  }'
          NEW_SHOW_JAVA = 'override fun showNewJavaError(message: String?, e: Throwable?) {\n    showNewError(message, e?.let { convertJavaStackTrace(it) } ?: emptyArray())\n  }'

          if 'override fun showNewJavaError(message: String?, e: Throwable) {' in content:
              content = content.replace(OLD_SHOW_JAVA, NEW_SHOW_JAVA)
              changed = True

          OLD_ASSIGN = '      lastErrorTitle = message\n      lastErrorStack = stack'
          NEW_ASSIGN = '      try {\n        val f1 = DevSupportManagerBase::class.java.getDeclaredField("mLastErrorTitle")\n        f1.isAccessible = true\n        f1.set(this, message)\n      } catch (_: Exception) {}\n      try {\n        val f2 = DevSupportManagerBase::class.java.getDeclaredField("mLastErrorStack")\n        f2.isAccessible = true\n        f2.set(this, stack)\n      } catch (_: Exception) {}'

          if 'lastErrorTitle = message' in content:
              content = content.replace(OLD_ASSIGN, NEW_ASSIGN)
              changed = True

          INSERTION = (
              '  override fun loadSplitBundleFromServer(bundlePath: String, callback: DevSplitBundleCallback) {\n'
              '    fetchSplitBundleAndCreateBundleLoader(\n'
              '      bundlePath,\n'
              '      object : DevSupportManagerBase.CallbackWithBundleLoader {\n'
              '        override fun onSuccess(bundleLoader: JSBundleLoader) {\n'
              '          callback.onSuccess()\n'
              '        }\n'
              '        override fun onError(url: String, cause: Throwable) {\n'
              '          callback.onError(url, cause)\n'
              '        }\n'
              '      })\n'
              '  }\n'
              '\n'
          )

          if 'loadSplitBundleFromServer' not in content:
              old_marker = '  override fun getUniqueTag(): String = "Bridgeless"\n\n  override fun handleReloadJS()'
              new_marker = '  override fun getUniqueTag(): String = "Bridgeless"\n' + INSERTION + '  override fun handleReloadJS()'
              content = content.replace(old_marker, new_marker)
              changed = True

          if changed:
              open(fn, 'w').write(content)
              print('Patched:', fn)
          PYEOF
          find -L node_modules -type f -name "ExpoLogBoxDevSupportManager.kt" \
            -exec python3 /tmp/patch_logbox.py {} \;

      - name: Patch NativeArrayBuffer.cpp to remove tryGetMutableBuffer (RN 0.79 JSI compat)
        run: |
          cat > /tmp/patch_arraybuffer.py << 'PYEOF'
          import sys
          fn = sys.argv[1]
          d = open(fn).read()
          changes = 0

          old1 = '  auto mutableBuffer = arrayBuffer.tryGetMutableBuffer(runtime);\n  if (mutableBuffer) {\n    auto byteBuffer = jni::JByteBuffer::wrapBytes(mutableBuffer->data(), mutableBuffer->size());\n    byteBuffer->order(jni::JByteOrder::nativeOrder());\n    auto value = NativeArrayBuffer::newObjectCxxArgs(byteBuffer, std::move(mutableBuffer));\n    jsiContext->jniDeallocator->addReference(value);\n    return value;\n  }\n\n  size_t size = arrayBuffer.size(runtime);'
          new1 = '  size_t size = arrayBuffer.size(runtime);'
          if old1 in d:
            d = d.replace(old1, new1)
            changes += 1

          old2 = '  auto backingBuffer = typedArray.getBuffer(runtime);\n  auto mutableBuffer = backingBuffer.tryGetMutableBuffer(runtime);\n  if (mutableBuffer) {\n    size_t offset = typedArray.byteOffset(runtime);\n    auto byteBuffer = jni::JByteBuffer::wrapBytes(\n      mutableBuffer->data() + offset, size);\n    byteBuffer->order(jni::JByteOrder::nativeOrder());\n    auto value = NativeArrayBuffer::newObjectCxxArgs(byteBuffer, std::move(mutableBuffer));\n    jsiContext->jniDeallocator->addReference(value);\n    return value;\n  }\n\n  auto byteBuffer = jni::JByteBuffer::allocateDirect(static_cast<jint>(size));'
          new2 = '  auto byteBuffer = jni::JByteBuffer::allocateDirect(static_cast<jint>(size));'
          if old2 in d:
            d = d.replace(old2, new2)
            changes += 1

          if changes > 0:
            open(fn, 'w').write(d)
            print(f'Patched: {fn} ({changes} changes)')
          PYEOF
          find -L node_modules -type f -name "NativeArrayBuffer.cpp" \
            -exec python3 /tmp/patch_arraybuffer.py {} \;

      - name: Patch NativeStatePropsGetter.cpp to remove UpdateMode arg (RN 0.79 updateState takes one arg)
        run: |
          find -L node_modules -type f -name "NativeStatePropsGetter.cpp" \
            -exec sed -i 's/state->updateState(std::move(newState), react::EventQueue::UpdateMode::unstable_Immediate);/state->updateState(std::move(newState));/g' {} \;

      - name: Patch ExpoReactHostFactory for RN 0.79 ReactHost API compat
        run: |
          cat > /tmp/patch_hostfactory.py << 'PYEOF'
          import sys
          fn = sys.argv[1]
          d = open(fn).read()
          changes = 0

          old = '  val reactHostImpl =\n        ReactHostImpl(\n          context,\n          delegate = reactHostDelegate,\n          componentFactory = componentFactory,\n          allowPackagerServerAccess = true,\n          useDevSupport = useDevSupport\n        )'
          new = '  val reactHostImpl =\n        ReactHostImpl(\n          context,\n          reactHostDelegate,\n          componentFactory,\n          true,\n          useDevSupport\n        )'
          if old in d:
            d = d.replace(old, new)
            changes += 1

          # DevSupportManager accessor not available in the AAR's ReactHostImpl;
          # onDidCreateDevSupportManager is a default empty method, safe to skip
          old_call = '        handler.onDidCreateReactHost(context, reactHostImpl)\n        handler.onDidCreateDevSupportManager(reactHostImpl.devSupportManager)'
          new_call = '        handler.onDidCreateReactHost(context, reactHostImpl)'
          if old_call in d:
            d = d.replace(old_call, new_call)
            changes += 1

          if changes > 0:
            open(fn, 'w').write(d)
            print(f'Patched: {fn} ({changes} changes)')
          PYEOF
          find -L node_modules -type f -name "ExpoReactHostFactory.kt" \
            -exec python3 /tmp/patch_hostfactory.py {} \;

      - name: Build Android APK
        run: ./gradlew assembleRelease
        working-directory: client/mobile-app/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: client/mobile-app/android/app/build/outputs/apk/release/*.apk

  desktop-linux:
    needs: server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build desktop app (Linux)
        run: pnpm --filter desktop run package:linux
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'ws://localhost:3000' }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: client/desktop/release/dist/*

  desktop-mac:
    needs: server
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build desktop app (macOS)
        run: pnpm --filter desktop run package:mac
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'ws://localhost:3000' }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: client/desktop/release/dist/*

  desktop-win:
    needs: server
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build desktop app (Windows)
        run: pnpm --filter desktop run package:win
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'ws://localhost:3000' }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: client/desktop/release/dist/*

  create-release:
    needs: [android, desktop-linux, desktop-mac, desktop-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Download release artifacts (skip Docker build artifact)
        run: |
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name apk \
            --name desktop-linux \
            --name desktop-mac \
            --name desktop-win \
            --dir .
        env:
          GH_TOKEN: ${{ github.token }}

      # - name: Generate checksums and create checksums.zip
      #   run: |
      #     mkdir -p checksums
      #     for dir in apk desktop-linux desktop-mac desktop-win; do
      #       if [ -d "$dir" ]; then
      #         find "$dir" -type f -exec sha256sum {} \; | sed "s|  $dir/|  |" > "checksums/$dir.sha256"
      #       fi
      #     done
      #     (cd checksums && zip -r9 ../checksums.zip .)
      #     rm -rf checksums

      - name: Collect blockmap files and create blockmaps.zip
        run: |
          mkdir -p blockmaps
          for dir in desktop-linux desktop-mac desktop-win; do
            if [ -d "$dir" ]; then
              find "$dir" -name "*.blockmap" -type f -exec mv {} blockmaps/ \;
            fi
          done
          (cd blockmaps && zip -r9 ../blockmaps.zip .)
          rm -rf blockmaps
          # Remove individual blockmap + SHA256SUMS from desktop dirs so they don't upload separately
          for dir in desktop-linux desktop-mac desktop-win; do
            [ -d "$dir" ] && rm -f "$dir"/*.blockmap "$dir"/SHA256SUMS
          done

      - name: Generate release notes
        id: release_notes
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            NOTES=$(git log --oneline --no-decorate -20)
          else
            NOTES=$(git log --oneline --no-decorate "${PREVIOUS_TAG}..HEAD")
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | od -A n -t x | tr -d ' \n')
          echo "notes<<$EOF" >> "$GITHUB_OUTPUT"
          echo "## Changes" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: true
          files: |
            apk/*.apk
            desktop-linux/*
            desktop-mac/*
            desktop-win/*
            blockmaps.zip
