              new_class = '''class PropertyComponentBuilderWithThis<ThisType>(
            val thisType: KType,
            name: String
          ) : PropertyComponentBuilder(name) {

            /**
             * Modifier that sets property getter that has caller.
             */
            inline fun <reified R> get(crossinline body: (ThisType) -> R) = apply {
              getter = SyncFunctionComponent("get", arrayOf(AnyType(thisType)), toReturnType<R>()) {
                @Suppress("UNCHECKED_CAST")
                body(it[0] as ThisType)
              }.also {
                it.setOwnerType(thisType)
                it.canTakeOwner = true
              }
            }

            /**
             * Modifier that sets property setter that receives only the new value as an argument.
             */
            inline fun <reified T> set(crossinline body: (self: ThisType, newValue: T) -> Unit) = apply {
              setter = SyncFunctionComponent("set", arrayOf(AnyType(thisType), toAnyType<T>()), toReturnType<Unit>()) {
                @Suppress("UNCHECKED_CAST")
                body(it[0] as ThisType, it[1] as T)
              }.also {
                it.setOwnerType(thisType)
                it.canTakeOwner = true
              }
            }
          }'''
              if old_class not in content:
                  print('FAIL (class body not found):', prop_builder)
                  sys.exit(1)
              content = content.replace(old_class, new_class, 1)
              old_import = 'import expo.modules.kotlin.types.descriptors.TypeDescriptor\n'
              new_import = 'import expo.modules.kotlin.types.descriptors.toTypeDescriptor\nimport kotlin.reflect.KType\n'
              if old_import in content:
                  content = content.replace(old_import, new_import, 1)
              else:
                  content = content.replace(
                      'import expo.modules.kotlin.types.AnyType\n',
                      'import expo.modules.kotlin.types.AnyType\nimport expo.modules.kotlin.types.descriptors.toTypeDescriptor\nimport kotlin.reflect.KType\n',
                      1
                  )
              with open(prop_builder, 'w') as f:
                  f.write(content)
              print('PATCHED:', prop_builder)

          class_builder = os.path.join(core, 'classcomponent', 'ClassComponentBuilder.kt')
          patch_file(
              class_builder,
              'PropertyComponentBuilderWithThis<SharedObjectType>(ownerType.typeDescriptor, name)',
              'PropertyComponentBuilderWithThis<SharedObjectType>(ownerType.kType, name)',
              replace_all=True
          )

          print('ALL PATCHES APPLIED')
          PYEOF
          done

      - name: Build Android APK
        run: ./gradlew assembleRelease
        working-directory: client/mobile-app/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: client/mobile-app/android/app/build/outputs/apk/release/*.apk

  desktop-linux:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build desktop app (Linux)
        run: pnpm --filter desktop run package:linux
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'ws://localhost:3000' }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: client/desktop/release/dist/*

  desktop-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build desktop app (macOS)
        run: pnpm --filter desktop run package:mac
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'ws://localhost:3000' }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: client/desktop/release/dist/*

  desktop-win:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build desktop app (Windows)
        run: pnpm --filter desktop run package:win
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'ws://localhost:3000' }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: client/desktop/release/dist/*

  create-release:
    needs: [server, android, desktop-linux, desktop-mac, desktop-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Download release artifacts (skip Docker build artifact)
        run: |
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name apk \
            --name desktop-linux \
            --name desktop-mac \
            --name desktop-win \
            --dir .
        env:
          GH_TOKEN: ${{ github.token }}

      # - name: Generate checksums and create checksums.zip
      #   run: |
      #     mkdir -p checksums
      #     for dir in apk desktop-linux desktop-mac desktop-win; do
      #       if [ -d "$dir" ]; then
      #         find "$dir" -type f -exec sha256sum {} \; | sed "s|  $dir/|  |" > "checksums/$dir.sha256"
      #       fi
      #     done
      #     (cd checksums && zip -r9 ../checksums.zip .)
      #     rm -rf checksums

      - name: Collect blockmap files and create blockmaps.zip
        run: |
          mkdir -p blockmaps
          for dir in desktop-linux desktop-mac desktop-win; do
            if [ -d "$dir" ]; then
              find "$dir" -name "*.blockmap" -type f -exec mv {} blockmaps/ \;
            fi
          done
          (cd blockmaps && zip -r9 ../blockmaps.zip .)
          rm -rf blockmaps
          # Remove individual blockmap + SHA256SUMS from desktop dirs so they don't upload separately
          for dir in desktop-linux desktop-mac desktop-win; do
            [ -d "$dir" ] && rm -f "$dir"/*.blockmap "$dir"/SHA256SUMS
          done

      - name: Generate release notes
        id: release_notes
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            NOTES=$(git log --oneline --no-decorate -20)
          else
            NOTES=$(git log --oneline --no-decorate "${PREVIOUS_TAG}..HEAD")
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | od -A n -t x | tr -d ' \n')
          echo "notes<<$EOF" >> "$GITHUB_OUTPUT"
          echo "## Changes" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: true
          files: |
            apk/*.apk
            desktop-linux/*
            desktop-mac/*
            desktop-win/*
            blockmaps.zip
