name: Release
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to checkout
        required: false
        default: master
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

  server:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Lowercase repo
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/server:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LOWER }}/server:latest

  android:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          echo "y" | "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" 2>&1 || true
        shell: bash

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            client/mobile-app/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('client/mobile-app/android/**/*.gradle*', 'client/mobile-app/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - run: pnpm install --frozen-lockfile

      - name: Patch Expo Promise.kt for RN 0.79 Promise interface compat
        run: |
          find -L node_modules -path "*/expo-modules-core/android/src/main/java/expo/modules/kotlin/Promise.kt" -exec sh -c '
            sed -i "/override fun reject(code: String?/s/code: String?/code: String/g" "$1"
            sed -i "/throwable: Throwable?, userInfo: WritableMap?)/s/code: String/code: String?/" "$1"
          ' _ {} \;
          find -L node_modules -path "*/expo-modules-core/android/src/main/java/expo/modules/kotlin/KPromiseWrapper.kt" -exec sh -c '
            sed -i "s/bridgePromise.reject(code, message, cause)/bridgePromise.reject(code ?: \"\", message, cause)/" "$1"
          ' _ {} \;

      - name: Patch ReactStylesDiffMapBackingFieldAccessor for RN 0.79
        run: |
          find -L node_modules -path "*/expo-modules-core/android/src/main/java/com/facebook/react/uimanager/ReactStylesDiffMapBackingFieldAccessor.java" -exec sed -i "s/diffMap.internal_backingMap()/diffMap.mBackingMap/" {} \;

      - name: Fix @react-native/codegen componentsUtils.js corrupted TSStringKeyword case
        run: |
          python3 << 'PYEOF'
          import sys, os

          def patch_file(fn):
              with open(fn) as f:
                  c = f.read()

              old = (
                  '        return {\n'
                  '          type: "StringTypeAnnotation",\n'
                  '        };\n'
                  "    case 'TSNumberKeyword':\n"
                  '      throw new Error(\n'
                  '        `Cannot use "${type}" type annotation for "${name}": must use a specific numeric type like Int32, Double, or Float`,\n'
                  '        return {\n'
                  '          type: "StringTypeAnnotation",\n'
                  '        };\n'
                  '      );\n'
                  "    case 'TSFunctionType':\n"
                  '      throw new Error(\n'
                  '        return {\n'
                  '          type: "StringTypeAnnotation",\n'
                  '        };\n'
                  '        `Cannot use "${type}" type annotation for "${name}": must use a specific function type like BubblingEventHandler, or DirectEventHandler`,\n'
                  '      );'
              )

              new = (
                  "    case 'TSStringKeyword':\n"
                  '      return {\n'
                  '        type: "StringTypeAnnotation",\n'
                  '      };\n'
                  "    case 'TSNumberKeyword':\n"
                  '      throw new Error(\n'
                  '        `Cannot use "${type}" type annotation for "${name}": must use a specific numeric type like Int32, Double, or Float`,\n'
                  '      );\n'
                  "    case 'TSFunctionType':\n"
                  '      throw new Error(\n'
                  '        `Cannot use "${type}" type annotation for "${name}": must use a specific function type like BubblingEventHandler, or DirectEventHandler`,\n'
                  '      );'
              )

              if old in c:
                  c = c.replace(old, new)
                  with open(fn, 'w') as f:
                      f.write(c)
                  return True
              return False

          patched = 0
          for root, dirs, files in os.walk('node_modules'):
              for fn in files:
                  if fn == 'componentsUtils.js' and '/typescript/components/' in root:
                      if patch_file(os.path.join(root, fn)):
                          patched += 1

          if patched == 0:
              print('No files needed patching')
          else:
              print(f'Patched {patched} file(s)')
          PYEOF

      - name: Generate native projects
        run: npx expo prebuild --clean
        working-directory: client/mobile-app

      - name: Patch MainApplication.kt for RN 0.79 ReactApplication interface + stub so-loader
        run: |
          python3 << 'PYEOF'
          fn = 'app/src/main/java/com/chatapp/mobile/MainApplication.kt'
          d = open(fn).read()
          changes = 0

          # Remove ReactNativeApplicationEntryPoint import (doesn't exist in RN 0.79)
          old_import = 'import com.facebook.react.ReactNativeApplicationEntryPoint.loadReactNative\n'
          if old_import in d:
            d = d.replace(old_import, '')
            changes += 1

          # If ReactNativeHost import is missing, add it after ReactApplication
          if 'import com.facebook.react.ReactNativeHost' not in d:
            d = d.replace(
              'import com.facebook.react.ReactApplication',
              'import com.facebook.react.ReactApplication\nimport com.facebook.react.ReactNativeHost')
            changes += 1

          # Add reactNativeHost property after the reactHost lazy block
          if 'override val reactNativeHost:' not in d:
            old_host = '  override val reactHost: ReactHost by lazy {'
            new_host = (
              '  override val reactNativeHost: ReactNativeHost = object : ReactNativeHost(this) {\n'
              '    override fun getUseDeveloperSupport(): Boolean = BuildConfig.DEBUG\n'
              '    override fun getPackages(): List<ReactPackage> = PackageList(this@MainApplication).packages\n'
              '  }\n\n'
              '  override val reactHost: ReactHost by lazy {')
            d = d.replace(old_host, new_host)
            changes += 1

          # Remove loadReactNative(this) call
          if 'loadReactNative(this)' in d:
            d = d.replace('    loadReactNative(this)\n', '')
            changes += 1

          # Add SoLoader import
          if 'import com.facebook.soloader.SoLoader' not in d:
            d = d.replace(
              'import com.facebook.react.defaults.DefaultNewArchitectureEntryPoint',
              'import com.facebook.react.defaults.DefaultNewArchitectureEntryPoint\nimport com.facebook.soloader.SoLoader')
            changes += 1

          # Add SoLoader.init() + pre-load libreactnative.so (triggers fbjni init) + load()
          if 'SoLoader.init(this, false)' not in d:
            old_oncreate = '    ApplicationLifecycleDispatcher.onApplicationCreate(this)'
            new_oncreate = (
              '    SoLoader.init(this, false)\n'
              '    SoLoader.loadLibrary("reactnative")\n'
              '    DefaultNewArchitectureEntryPoint.load()\n'
              '    ApplicationLifecycleDispatcher.onApplicationCreate(this)')
            d = d.replace(old_oncreate, new_oncreate)
            changes += 1

          if changes > 0:
            open(fn, 'w').write(d)
            print(f'Patched: {fn} ({changes} changes)')
          PYEOF
        working-directory: client/mobile-app/android

      - name: Patch react-android AAR (replace BlobCollector with no-op)
        run: |
          # BlobModule.initialize() calls BlobCollector.install() which invokes the
          # native BlobCollector.nativeInstall(). That native method lives in
          # libreactnative.so with -fvisibility=hidden (reactnativeblob lib), so the
          # stub .so cannot dlsym its registerNatives and the JNI call crashes with
          # UnsatisfiedLinkError. Replace BlobCollector.class inside the prebuilt
          # react-android AAR with a no-op (same JVM signature
          # install:(ReactContext, BlobModule)V), publish it to a local Maven repo
          # as version 0.79.2-local, and force that version via the root
          # build.gradle resolutionStrategy. JS side already guards
          # `global.__blobCollectorProvider == null`.
          cd /tmp
          curl -sL -o react-android.aar "https://repo1.maven.org/maven2/com/facebook/react/react-android/0.79.2/react-android-0.79.2-release.aar"
          curl -sL -o react-android.pom "https://repo1.maven.org/maven2/com/facebook/react/react-android/0.79.2/react-android-0.79.2.pom"
          curl -sL -o react-android.module "https://repo1.maven.org/maven2/com/facebook/react/react-android/0.79.2/react-android-0.79.2.module"
          python3 << 'PYEOF'
          import zipfile, shutil, os
          with zipfile.ZipFile('react-android.aar') as z:
              z.extract('classes.jar')
          with open('BlobCollector.java', 'w') as f:
              f.write('''package com.facebook.react.modules.blob;

          import com.facebook.react.bridge.ReactContext;

          public final class BlobCollector {
            private BlobCollector() {}

            public static void install(ReactContext reactContext, BlobModule blobModule) {
              // No-op: native blob collector GC tracking not available in this build.
            }
          }
          ''')
          PYEOF
          mkdir -p out
          "$JAVA_HOME/bin/javac" -proc:none -cp classes.jar -d out BlobCollector.java
          # Compile a Java replacement for ReactSurfaceView that always measures
          # against the full window size. A stuck IME insets animation on some
          # devices measures the surface with the window's visible-frame height
          # (full window minus phantom keyboard insets), permanently shrinking
          # the React root view and showing only the top half of the UI.
          cat > ReactSurfaceView.java << 'JAVA'
          package com.facebook.react.runtime;
          
          import android.content.Context;
          import android.graphics.Point;
          import android.graphics.Rect;
          import android.util.DisplayMetrics;
          import android.util.Log;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.View.MeasureSpec;
          import com.facebook.react.ReactRootView;
          import com.facebook.react.bridge.ReactContext;
          import com.facebook.react.config.ReactFeatureFlags;
          import com.facebook.react.uimanager.IllegalViewOperationException;
          import com.facebook.react.uimanager.JSPointerDispatcher;
          import com.facebook.react.uimanager.JSTouchDispatcher;
          import com.facebook.react.uimanager.common.UIManagerType;
          import com.facebook.react.uimanager.events.EventDispatcher;
          
          /** Java replacement for the Kotlin ReactSurfaceView shipped in react-android. */
          public class ReactSurfaceView extends ReactRootView {
            private static final String TAG = "ReactSurfaceView";
          
            private final ReactSurfaceImpl surface;
            private final JSTouchDispatcher jsTouchDispatcher = new JSTouchDispatcher(this);
            private JSPointerDispatcher jsPointerDispatcher;
            private boolean wasMeasured;
            private int widthMeasureSpec;
            private int heightMeasureSpec;
          
            public ReactSurfaceView(Context context, ReactSurfaceImpl surface) {
              super(context);
              this.surface = surface;
              if (ReactFeatureFlags.dispatchPointerEvents) {
                jsPointerDispatcher = new JSPointerDispatcher(this);
              }
            }
          
            @Override
            protected void onMeasure(int widthMeasureSpec, int heightMeasureSpec) {
              DisplayMetrics dm = getContext().getResources().getDisplayMetrics();
              widthMeasureSpec = MeasureSpec.makeMeasureSpec(dm.widthPixels, MeasureSpec.EXACTLY);
              heightMeasureSpec = MeasureSpec.makeMeasureSpec(dm.heightPixels, MeasureSpec.EXACTLY);
              int width = 0;
              int height = 0;
              int widthMode = MeasureSpec.getMode(widthMeasureSpec);
              if (widthMode == MeasureSpec.AT_MOST || widthMode == MeasureSpec.UNSPECIFIED) {
                for (int i = 0; i < getChildCount(); i++) {
                  View child = getChildAt(i);
                  width = Math.max(width, child.getLeft() + child.getMeasuredWidth() + child.getPaddingLeft() + child.getPaddingRight());
                }
              } else {
                width = MeasureSpec.getSize(widthMeasureSpec);
              }
              int heightMode = MeasureSpec.getMode(heightMeasureSpec);
              if (heightMode == MeasureSpec.AT_MOST || heightMode == MeasureSpec.UNSPECIFIED) {
                for (int i = 0; i < getChildCount(); i++) {
                  View child = getChildAt(i);
                  height = Math.max(height, child.getTop() + child.getMeasuredHeight() + child.getPaddingTop() + child.getPaddingBottom());
                }
              } else {
                height = MeasureSpec.getSize(heightMeasureSpec);
              }
              setMeasuredDimension(width, height);
              wasMeasured = true;
              this.widthMeasureSpec = widthMeasureSpec;
              this.heightMeasureSpec = heightMeasureSpec;
              Point viewportOffset = computeViewportOffset();
              surface.updateLayoutSpecs(widthMeasureSpec, heightMeasureSpec, viewportOffset.x, viewportOffset.y);
            }
          
            @Override
            protected void onLayout(boolean changed, int left, int top, int right, int bottom) {
              if (wasMeasured && changed) {
                Point viewportOffset = computeViewportOffset();
                surface.updateLayoutSpecs(widthMeasureSpec, heightMeasureSpec, viewportOffset.x, viewportOffset.y);
              }
            }
          
            private Point computeViewportOffset() {
              int[] locationOnScreen = new int[2];
              getLocationOnScreen(locationOnScreen);
              Rect visibleWindowFrame = new Rect();
              getWindowVisibleDisplayFrame(visibleWindowFrame);
              return new Point(locationOnScreen[0] - visibleWindowFrame.left, locationOnScreen[1] - visibleWindowFrame.top);
            }
          
            @Override
            public boolean isViewAttachedToReactInstance() {
              return surface.isAttached();
            }
          
            @Override
            public boolean hasActiveReactContext() {
              return surface.isAttached() && getCurrentReactContext() != null;
            }
          
            @Override
            public boolean hasActiveReactInstance() {
              return surface.isAttached() && surface.getReactHost() != null && surface.getReactHost().isInstanceInitialized();
            }
          
            @Override
            public ReactContext getCurrentReactContext() {
              ReactHostImpl host = surface.getReactHost();
              return host != null ? host.getCurrentReactContext() : null;
            }
          
            @Override
            public String getJSModuleName() {
              return surface.getModuleName();
            }
          
            @Override
            public void setIsFabric(boolean isFabric) {
              super.setIsFabric(true);
            }
          
            @Override
            public int getUIManagerType() {
              return UIManagerType.FABRIC;
            }
          
            @Override
            public void handleException(Throwable t) {
              IllegalViewOperationException e = new IllegalViewOperationException(String.valueOf(t.getMessage()), this, t);
              ReactHostImpl host = surface.getReactHost();
              if (host != null) {
                host.handleHostException(e);
              } else {
                throw new RuntimeException(e);
              }
            }
          
            @Override
            protected void dispatchJSTouchEvent(MotionEvent event) {
              EventDispatcher eventDispatcher = surface.getEventDispatcher();
              ReactHostImpl host = surface.getReactHost();
              if (eventDispatcher != null && host != null) {
                jsTouchDispatcher.handleTouchEvent(event, eventDispatcher, host.getCurrentReactContext());
              } else {
                Log.w(TAG, "Unable to dispatch touch events to JS as the React instance has not been attached");
              }
            }
          
            @Override
            protected void dispatchJSPointerEvent(MotionEvent event, boolean isCapture) {
              if (jsPointerDispatcher == null) {
                if (!ReactFeatureFlags.dispatchPointerEvents) {
                  return;
                }
                Log.w(TAG, "Unable to dispatch pointer events to JS before the dispatcher is available");
                return;
              }
              EventDispatcher eventDispatcher = surface.getEventDispatcher();
              if (eventDispatcher != null) {
                jsPointerDispatcher.handleMotionEvent(event, eventDispatcher, isCapture);
              }
            }
          
            @Override
            public void onChildStartedNativeGesture(View childView, MotionEvent ev) {
              EventDispatcher eventDispatcher = surface.getEventDispatcher();
              if (eventDispatcher == null) {
                return;
              }
              jsTouchDispatcher.onChildStartedNativeGesture(ev, eventDispatcher);
              if (jsPointerDispatcher != null) {
                jsPointerDispatcher.onChildStartedNativeGesture(childView, ev, eventDispatcher);
              }
            }
          
            @Override
            public void onChildEndedNativeGesture(View childView, MotionEvent ev) {
              EventDispatcher eventDispatcher = surface.getEventDispatcher();
              if (eventDispatcher == null) {
                return;
              }
              jsTouchDispatcher.onChildEndedNativeGesture(ev, eventDispatcher);
              if (jsPointerDispatcher != null) {
                jsPointerDispatcher.onChildEndedNativeGesture();
              }
            }
          }
          JAVA
          ANDROID_JAR="$(ls -d "$ANDROID_HOME"/platforms/android-*/ 2>/dev/null | sort -V | tail -1)"
          if [ -z "$ANDROID_JAR" ]; then
            echo "no android platform found under $ANDROID_HOME/platforms" >&2
            ls "$ANDROID_HOME" >&2 || true
            exit 1
          fi
          ANDROID_JAR="$ANDROID_JAR/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            echo "android.jar not found in $ANDROID_JAR" >&2
            exit 1
          fi
          mkdir -p out2
          "$JAVA_HOME/bin/javac" -proc:none -cp "classes.jar:$ANDROID_JAR" -d out2 ReactSurfaceView.java
          python3 << 'PYEOF'
          import zipfile, shutil
          for new_cls in ['out/com/facebook/react/modules/blob/BlobCollector.class',
                          'out2/com/facebook/react/runtime/ReactSurfaceView.class']:
              name = new_cls.split('/', 1)[1]
              with zipfile.ZipFile('classes.jar') as zin, zipfile.ZipFile('classes_patched.jar', 'w', zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename == name:
                          zout.write(new_cls, item.filename)
                      else:
                          zout.writestr(item, zin.read(item.filename))
              shutil.move('classes_patched.jar', 'classes.jar')
          with zipfile.ZipFile('react-android.aar') as zin, zipfile.ZipFile('react-android-patched.aar', 'w', zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  if item.filename == 'classes.jar':
                      zout.write('classes.jar', item.filename)
                  else:
                      zout.writestr(item, zin.read(item.filename))
          print('patched AAR ready')
          PYEOF
          LOCALMVN="$GITHUB_WORKSPACE/client/mobile-app/android/app/localMaven/com/facebook/react/react-android/0.79.2-local"
          mkdir -p "$LOCALMVN"
          cp react-android-patched.aar "$LOCALMVN/react-android-0.79.2-local-release.aar"
          sed 's|<version>0.79.2</version>|<version>0.79.2-local</version>|' react-android.pom > "$LOCALMVN/react-android-0.79.2-local.pom"
          python3 << PYEOF
          import json
          d = json.load(open('react-android.module'))
          d['component']['version'] = '0.79.2-local'
          for v in d['variants']:
              for f in v.get('files', []):
                  f['name'] = f['name'].replace('react-android-0.79.2', 'react-android-0.79.2-local')
                  f['url'] = f['url'].replace('react-android-0.79.2', 'react-android-0.79.2-local')
          json.dump(d, open('$LOCALMVN/react-android-0.79.2-local.module', 'w'))
          print('module metadata written for 0.79.2-local')
          PYEOF
          python3 << PYEOF
          with open('$GITHUB_WORKSPACE/client/mobile-app/android/build.gradle') as f:
              c = f.read()
          if '0.79.2-local' not in c:
              old = "allprojects {\n  repositories {\n    google()\n    mavenCentral()\n    maven { url 'https://www.jitpack.io' }\n  }\n}"
              new = "allprojects {\n  repositories {\n    maven { url \"\$rootDir/app/localMaven\" }\n    google()\n    mavenCentral()\n    maven { url 'https://www.jitpack.io' }\n  }\n  configurations.configureEach {\n    resolutionStrategy.eachDependency { details ->\n      if (details.requested.group == 'com.facebook.react' && details.requested.name == 'react-android') {\n        details.useVersion('0.79.2-local')\n      }\n    }\n  }\n}"
              if old in c:
                  c = c.replace(old, new, 1)
                  with open('$GITHUB_WORKSPACE/client/mobile-app/android/build.gradle', 'w') as f:
                      f.write(c)
                  print('build.gradle patched')
              else:
                  print('WARNING: allprojects block not found, build.gradle NOT patched')
          else:
              print('build.gradle already patched')
          PYEOF
        working-directory: client/mobile-app/android

      - name: Compile stub .so for all 4 merged RN libraries
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/27.1.12297006"
          if [ ! -d "$NDK_DIR" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            [ -f "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
            echo "y" | "$SDKMANAGER" --install "ndk;27.1.12297006" 2>&1 || true
          fi
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86,x86_64}

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            case "$abi" in
              arm64-v8a)  CC="aarch64-linux-android21-clang"    ;;
              armeabi-v7a) CC="armv7a-linux-androideabi21-clang" ;;
              x86)        CC="i686-linux-android21-clang"        ;;
              x86_64)     CC="x86_64-linux-android21-clang"      ;;
            esac
            for lib in react_featureflagsjni react_newarchdefaults fabricjni turbomodulejsijni reactnativejni rninstance react_devsupportjni hermesinstancejni reactnativeblob uimanagerjni; do
              TMP="/tmp/stub_${lib}.c"
              CXXCALLBACK_CODE=''
              CXXCALLBACK_REG=''
               # Generate a dedicated stub that calls the right registerNatives
              case "$lib" in
                react_featureflagsjni)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react34JReactNativeFeatureFlagsCxxInterop15registerNativesEv"); if (r) r();' ;;
                fabricjni)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react22FabricUIManagerBinding15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react16ComponentFactory15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react25DefaultComponentsRegistry15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react21SurfaceHandlerBinding15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react16StateWrapperImpl15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react19EventEmitterWrapper15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react16EventBeatManager15registerNativesEv"); if (r) r();' ;;
                turbomodulejsijni)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react18TurboModuleManager15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react33DefaultTurboModuleManagerDelegate15registerNativesEv"); if (r) r();' ;;
                reactnativejni)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react17WritableNativeMap15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react19WritableNativeArray15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react17ReadableNativeMap15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react19ReadableNativeArray15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react9NativeMap15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react11NativeArray15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react20CatalystInstanceImpl15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react17CallInvokerHolder15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react29NativeMethodCallInvokerHolder15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react12JReactMarker15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react16JJSTimerExecutor15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react14JDynamicNative15registerNativesEv"); if (r) r();'
                  # JCxxCallbackImpl::registerNatives is header-inline (no exported symbol) so it
                  # cannot be dlsym'd. Register its JNI method directly with a thunk that invokes
                  # the stored std::function<void(folly::dynamic)> callback.
                  # Java layout: CxxCallbackImpl (extends HybridClassBase extends HybridData)
                  #   HybridData.mDestructor : HybridData$Destructor
                  #   HybridData$Destructor.mNativePointer : J  -> C++ JCxxCallbackImpl*
                  # C++ layout verified from merged libreactnative.so disassembly:
                  #   dtor 0x46f19c: std::function stored ptr at offset 0x30, inline buffer at 0x10
                  #   __func vtable (at 0x62a708, vptr = +0x10): [2]=__clone, [3]=__clone(into dst),
                  #     [4]=__destroy, [6]=__call (0x43684c -> Instance::callJSCallback(callbackId, dynamic&&))
                  #   __call ABI: (x0=functor, x1=folly::dynamic*); moves the dynamic out of the array.
                  # Array argument: ReadableNativeArray*; folly::dynamic array_ at +16 (consume 0x523b1c).
                  CXXCALLBACK_CODE='
                  static void cxxcallback_nativeinvoke(JNIEnv* env, jobject thiz, jobject array) {
                    jclass hd = (*env)->GetObjectClass(env, thiz);
                    jfieldID dtorField = (*env)->GetFieldID(env, hd, "mDestructor", "Lcom/facebook/jni/HybridData$Destructor;");
                    if (!dtorField) return;
                    jobject dtor = (*env)->GetObjectField(env, thiz, dtorField);
                    if (!dtor) return;
                    jclass dtCls = (*env)->GetObjectClass(env, dtor);
                    jfieldID ptrField = (*env)->GetFieldID(env, dtCls, "mNativePointer", "J");
                    if (!ptrField) return;
                    void* cxx = (void*)(*env)->GetLongField(env, dtor, ptrField);
                    if (!cxx) return;
                    void* fn = *(void**)((char*)cxx + 0x30);
                    if (!fn) return;
                    void** vt = *(void***)fn;
                    if (!vt) return;
                    void* call = vt[6];
                    if (!call) return;
                    jobject adtor = (*env)->GetObjectField(env, array, dtorField);
                    if (!adtor) return;
                    void* acxx = (void*)(*env)->GetLongField(env, adtor, ptrField);
                    if (!acxx) return;
                    ((void (*)(void*, void*))call)(fn, (char*)acxx + 0x10);
                  }
                  '
                  CXXCALLBACK_REG='
                  {
                    JNIEnv* env = 0;
                    if ((*vm)->GetEnv(vm, (void**)&env, JNI_VERSION_1_6) != JNI_OK || !env) return JNI_VERSION_1_6;
                    jclass cxx = (*env)->FindClass(env, "com/facebook/react/bridge/CxxCallbackImpl");
                    if (cxx) {
                      JNINativeMethod m[1];
                      m[0].name = (char*)"nativeInvoke";
                      m[0].signature = (char*)"(Lcom/facebook/react/bridge/NativeArray;)V";
                      m[0].fnPtr = (void*)cxxcallback_nativeinvoke;
                      (*env)->RegisterNatives(env, cxx, m, 1);
                    }
                  }
                  ' ;;
                rninstance)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react14JReactInstance15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react35ReactInstanceManagerInspectorTarget15registerNativesEv"); if (r) r();' ;;
                react_devsupportjni)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react18jsinspector_modern15JInspectorFlags15registerNativesEv"); if (r) r();' ;;
                hermesinstancejni)
                  DLLIB="libhermestooling.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react15JHermesInstance15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook3jsi3jni22HermesSamplingProfiler15registerNativesEv"); if (r) r();' ;;
                uimanagerjni)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react28ComponentNameResolverBinding15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react26UIConstantsProviderBinding15registerNativesEv"); if (r) r();' ;;
                *)                     DLLIB="libreactnative.so"; REGCALL='/* no registerNatives needed */' ;;
              esac
              cat > "$TMP" << SCEOF
          #include <jni.h>
          #include <dlfcn.h>
          static void do_reg(void) {
            void* h = dlopen("$DLLIB", RTLD_NOW | RTLD_GLOBAL);
            if (!h) return;
            typedef void (*reg_t)();
            reg_t r;
            $REGCALL
          }
          SCEOF
              if [ -n "$CXXCALLBACK_CODE" ]; then printf '%s' "$CXXCALLBACK_CODE" >> "$TMP"; fi
              cat >> "$TMP" << SCEOF
          JNIEXPORT jint JNI_OnLoad(JavaVM* vm, void* reserved) {
            do_reg();
          SCEOF
              if [ -n "$CXXCALLBACK_REG" ]; then printf '%s' "$CXXCALLBACK_REG" >> "$TMP"; fi
              cat >> "$TMP" << SCEOF
            return JNI_VERSION_1_6;
          }
          SCEOF
              "$TOOLCHAIN/$CC" -shared -o "app/src/main/jniLibs/$abi/lib${lib}.so" "$TMP"
            done
          done

          echo "=== Compiled stubs ==="
          find app/src/main/jniLibs -name '*.so' -exec ls -la {} \;
        working-directory: client/mobile-app/android
