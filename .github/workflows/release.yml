name: Release
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to checkout
        required: false
        default: master
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

  server:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Lowercase repo
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/server:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LOWER }}/server:latest

  android:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -f "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          echo "y" | "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" 2>&1 || true
        shell: bash

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            client/mobile-app/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('client/mobile-app/android/**/*.gradle*', 'client/mobile-app/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - run: pnpm install --frozen-lockfile

      - name: Patch Expo Promise.kt for RN 0.79 Promise interface compat
        run: |
          find -L node_modules -path "*/expo-modules-core/android/src/main/java/expo/modules/kotlin/Promise.kt" -exec sh -c '
            sed -i "/override fun reject(code: String?/s/code: String?/code: String/g" "$1"
            sed -i "/throwable: Throwable?, userInfo: WritableMap?)/s/code: String/code: String?/" "$1"
          ' _ {} \;
          find -L node_modules -path "*/expo-modules-core/android/src/main/java/expo/modules/kotlin/KPromiseWrapper.kt" -exec sh -c '
            sed -i "s/bridgePromise.reject(code, message, cause)/bridgePromise.reject(code ?: \"\", message, cause)/" "$1"
          ' _ {} \;

      - name: Patch ReactStylesDiffMapBackingFieldAccessor for RN 0.79
        run: |
          find -L node_modules -path "*/expo-modules-core/android/src/main/java/com/facebook/react/uimanager/ReactStylesDiffMapBackingFieldAccessor.java" -exec sed -i "s/diffMap.internal_backingMap()/diffMap.mBackingMap/" {} \;

      - name: Fix @react-native/codegen componentsUtils.js corrupted TSStringKeyword case
        run: |
          python3 << 'PYEOF'
          import sys, os

          def patch_file(fn):
              with open(fn) as f:
                  c = f.read()

              old = (
                  '        return {\n'
                  '          type: "StringTypeAnnotation",\n'
                  '        };\n'
                  "    case 'TSNumberKeyword':\n"
                  '      throw new Error(\n'
                  '        `Cannot use "${type}" type annotation for "${name}": must use a specific numeric type like Int32, Double, or Float`,\n'
                  '        return {\n'
                  '          type: "StringTypeAnnotation",\n'
                  '        };\n'
                  '      );\n'
                  "    case 'TSFunctionType':\n"
                  '      throw new Error(\n'
                  '        return {\n'
                  '          type: "StringTypeAnnotation",\n'
                  '        };\n'
                  '        `Cannot use "${type}" type annotation for "${name}": must use a specific function type like BubblingEventHandler, or DirectEventHandler`,\n'
                  '      );'
              )

              new = (
                  "    case 'TSStringKeyword':\n"
                  '      return {\n'
                  '        type: "StringTypeAnnotation",\n'
                  '      };\n'
                  "    case 'TSNumberKeyword':\n"
                  '      throw new Error(\n'
                  '        `Cannot use "${type}" type annotation for "${name}": must use a specific numeric type like Int32, Double, or Float`,\n'
                  '      );\n'
                  "    case 'TSFunctionType':\n"
                  '      throw new Error(\n'
                  '        `Cannot use "${type}" type annotation for "${name}": must use a specific function type like BubblingEventHandler, or DirectEventHandler`,\n'
                  '      );'
              )

              if old in c:
                  c = c.replace(old, new)
                  with open(fn, 'w') as f:
                      f.write(c)
                  return True
              return False

          patched = 0
          for root, dirs, files in os.walk('node_modules'):
              for fn in files:
                  if fn == 'componentsUtils.js' and '/typescript/components/' in root:
                      if patch_file(os.path.join(root, fn)):
                          patched += 1

          if patched == 0:
              print('No files needed patching')
          else:
              print(f'Patched {patched} file(s)')
          PYEOF

      - name: Generate native projects
        run: npx expo prebuild --clean
        working-directory: client/mobile-app

      - name: Patch MainApplication.kt for RN 0.79 ReactApplication interface + stub so-loader
        run: |
          python3 << 'PYEOF'
          fn = 'app/src/main/java/com/chatapp/mobile/MainApplication.kt'
          d = open(fn).read()
          changes = 0

          # Remove ReactNativeApplicationEntryPoint import (doesn't exist in RN 0.79)
          old_import = 'import com.facebook.react.ReactNativeApplicationEntryPoint.loadReactNative\n'
          if old_import in d:
            d = d.replace(old_import, '')
            changes += 1

          # If ReactNativeHost import is missing, add it after ReactApplication
          if 'import com.facebook.react.ReactNativeHost' not in d:
            d = d.replace(
              'import com.facebook.react.ReactApplication',
              'import com.facebook.react.ReactApplication\nimport com.facebook.react.ReactNativeHost')
            changes += 1

          # Add reactNativeHost property after the reactHost lazy block
          if 'override val reactNativeHost:' not in d:
            old_host = '  override val reactHost: ReactHost by lazy {'
            new_host = (
              '  override val reactNativeHost: ReactNativeHost = object : ReactNativeHost(this) {\n'
              '    override fun getUseDeveloperSupport(): Boolean = BuildConfig.DEBUG\n'
              '    override fun getPackages(): List<ReactPackage> = PackageList(this@MainApplication).packages\n'
              '  }\n\n'
              '  override val reactHost: ReactHost by lazy {')
            d = d.replace(old_host, new_host)
            changes += 1

          # Remove loadReactNative(this) call
          if 'loadReactNative(this)' in d:
            d = d.replace('    loadReactNative(this)\n', '')
            changes += 1

          # Add SoLoader import
          if 'import com.facebook.soloader.SoLoader' not in d:
            d = d.replace(
              'import com.facebook.react.defaults.DefaultNewArchitectureEntryPoint',
              'import com.facebook.react.defaults.DefaultNewArchitectureEntryPoint\nimport com.facebook.soloader.SoLoader')
            changes += 1

          # Add SoLoader.init() + pre-load libreactnative.so (triggers fbjni init) + load()
          if 'SoLoader.init(this, false)' not in d:
            old_oncreate = '    ApplicationLifecycleDispatcher.onApplicationCreate(this)'
            new_oncreate = (
              '    SoLoader.init(this, false)\n'
              '    SoLoader.loadLibrary("reactnative")\n'
              '    DefaultNewArchitectureEntryPoint.load()\n'
              '    ApplicationLifecycleDispatcher.onApplicationCreate(this)')
            d = d.replace(old_oncreate, new_oncreate)
            changes += 1

          if changes > 0:
            open(fn, 'w').write(d)
            print(f'Patched: {fn} ({changes} changes)')
          PYEOF
        working-directory: client/mobile-app/android

      - name: Shadow BlobCollector with no-op (prebuilt AAR's native install not registered)
        run: |
          # BlobModule.initialize() calls BlobCollector.install() which invokes the
          # native BlobCollector.nativeInstall(). That native method lives in
          # libreactnative.so with -fvisibility=hidden (reactnativeblob lib), so the
          # stub .so cannot dlsym its registerNatives and the JNI call crashes with
          # UnsatisfiedLinkError. The app classes take classloader priority over the
          # prebuilt react-android AAR, so shadowing the class with a no-op install()
          # (same JVM signature install:(ReactContext, BlobModule)V) skips the native
          # call entirely. JS side already guards `global.__blobCollectorProvider == null`.
          mkdir -p app/src/main/java/com/facebook/react/modules/blob
          cat > app/src/main/java/com/facebook/react/modules/blob/BlobCollector.java << 'SHADOW'
          package com.facebook.react.modules.blob;

          import com.facebook.react.bridge.ReactContext;

          public final class BlobCollector {
            private BlobCollector() {}

            public static void install(ReactContext reactContext, BlobModule blobModule) {
              // No-op: native blob collector GC tracking not available in this build.
            }
          }
          SHADOW
          cat app/src/main/java/com/facebook/react/modules/blob/BlobCollector.java
        working-directory: client/mobile-app/android

      - name: Compile stub .so for all 4 merged RN libraries
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/27.1.12297006"
          if [ ! -d "$NDK_DIR" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            [ -f "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
            echo "y" | "$SDKMANAGER" --install "ndk;27.1.12297006" 2>&1 || true
          fi
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86,x86_64}

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            case "$abi" in
              arm64-v8a)  CC="aarch64-linux-android21-clang"    ;;
              armeabi-v7a) CC="armv7a-linux-androideabi21-clang" ;;
              x86)        CC="i686-linux-android21-clang"        ;;
              x86_64)     CC="x86_64-linux-android21-clang"      ;;
            esac
            for lib in react_featureflagsjni react_newarchdefaults fabricjni turbomodulejsijni reactnativejni rninstance react_devsupportjni hermesinstancejni reactnativeblob uimanagerjni; do
              TMP="/tmp/stub_${lib}.c"
               # Generate a dedicated stub that calls the right registerNatives
              case "$lib" in
                react_featureflagsjni)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react34JReactNativeFeatureFlagsCxxInterop15registerNativesEv"); if (r) r();' ;;
                fabricjni)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react22FabricUIManagerBinding15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react16ComponentFactory15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react25DefaultComponentsRegistry15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react21SurfaceHandlerBinding15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react16StateWrapperImpl15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react19EventEmitterWrapper15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react16EventBeatManager15registerNativesEv"); if (r) r();' ;;
                turbomodulejsijni)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react18TurboModuleManager15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react33DefaultTurboModuleManagerDelegate15registerNativesEv"); if (r) r();' ;;
                reactnativejni)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react17WritableNativeMap15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react19WritableNativeArray15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react17ReadableNativeMap15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react19ReadableNativeArray15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react9NativeMap15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react11NativeArray15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react20CatalystInstanceImpl15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react17CallInvokerHolder15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react29NativeMethodCallInvokerHolder15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react12JReactMarker15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react16JJSTimerExecutor15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react14JDynamicNative15registerNativesEv"); if (r) r();' ;;
                rninstance)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react14JReactInstance15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react35ReactInstanceManagerInspectorTarget15registerNativesEv"); if (r) r();' ;;
                react_devsupportjni)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react18jsinspector_modern15JInspectorFlags15registerNativesEv"); if (r) r();' ;;
                hermesinstancejni)
                  DLLIB="libhermestooling.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react15JHermesInstance15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook3jsi3jni22HermesSamplingProfiler15registerNativesEv"); if (r) r();' ;;
                uimanagerjni)
                  DLLIB="libreactnative.so"
                  REGCALL='r = (reg_t)dlsym(h, "_ZN8facebook5react28ComponentNameResolverBinding15registerNativesEv"); if (r) r(); r = (reg_t)dlsym(h, "_ZN8facebook5react26UIConstantsProviderBinding15registerNativesEv"); if (r) r();' ;;
                *)                     DLLIB="libreactnative.so"; REGCALL='/* no registerNatives needed */' ;;
              esac
              cat > "$TMP" << SCEOF
          #include <jni.h>
          #include <dlfcn.h>
          static void do_reg(void) {
            void* h = dlopen("$DLLIB", RTLD_NOW | RTLD_GLOBAL);
            if (!h) return;
            typedef void (*reg_t)();
            reg_t r;
            $REGCALL
          }
          JNIEXPORT jint JNI_OnLoad(JavaVM* vm, void* reserved) {
            do_reg();
            return JNI_VERSION_1_6;
          }
          SCEOF
              "$TOOLCHAIN/$CC" -shared -o "app/src/main/jniLibs/$abi/lib${lib}.so" "$TMP"
            done
          done

          echo "=== Compiled stubs ==="
          find app/src/main/jniLibs -name '*.so' -exec ls -la {} \;
        working-directory: client/mobile-app/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Pin Gradle version
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.12-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
        working-directory: client/mobile-app/android

      - name: Bypass Expo Kotlin version check
        run: |
          sed -i "s/^buildscript {/buildscript {\n    ext.kotlinVersion = '2.2.21'\n    ext.kspVersion = '2.2.21-2.0.5'/" build.gradle
          sed -i "s|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')|classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21')|" build.gradle
        working-directory: client/mobile-app/android

      - name: Fix Hermes compiler path
        run: |
          sed -i "s|require.resolve('hermes-compiler/package.json', { paths: \[require.resolve('react-native/package.json')\] })|require.resolve('react-native/package.json')|" app/build.gradle
          sed -i "s|getParentFile().getAbsolutePath() + \"/hermesc/|getParentFile().getAbsolutePath() + \"/sdks/hermesc/|" app/build.gradle
        working-directory: client/mobile-app/android

      - name: Pin androidx.core for compileSdk 35 compatibility
        run: |
          python3 << 'PYEOF'
          with open('app/build.gradle') as f:
              c = f.read()
          block = "configurations.all {\n    resolutionStrategy {\n        force 'androidx.core:core:1.15.0'\n        force 'androidx.core:core-ktx:1.15.0'\n    }\n}\n\n"
          c = c.replace('dependencies {', block + 'dependencies {', 1)
          with open('app/build.gradle', 'w') as f:
              f.write(c)
          PYEOF
        working-directory: client/mobile-app/android

      - name: Remove assetsPaths from configChanges (API 36+ flag incompatible with compileSdk 35)
        run: |
          sed -i 's/|assetsPaths//g' app/src/main/AndroidManifest.xml
        working-directory: client/mobile-app/android

      - name: Patch Expo log-box for RN 0.79 DevSupportManagerBase compatibility
        run: |
          cat > /tmp/patch_logbox.py << 'PYEOF'
          import sys
          fn = sys.argv[1]
          content = open(fn).read()
          changed = False

          OLD_IMPORT = 'import com.facebook.react.devsupport.interfaces.StackFrame'
          NEW_IMPORT = 'import com.facebook.react.bridge.JSBundleLoader\nimport com.facebook.react.devsupport.interfaces.DevSplitBundleCallback\nimport com.facebook.react.devsupport.interfaces.StackFrame'

          if 'import com.facebook.react.bridge.JSBundleLoader' not in content:
              content = content.replace(OLD_IMPORT, NEW_IMPORT)
              changed = True

          OLD_UNIQUE = '  override val uniqueTag: String\n    get() = "Bridgeless"'
          NEW_UNIQUE = '  override fun getUniqueTag(): String = "Bridgeless"'

          if 'override val uniqueTag: String' in content:
              content = content.replace(OLD_UNIQUE, NEW_UNIQUE)
              changed = True

          OLD_SHOW_JAVA = 'override fun showNewJavaError(message: String?, e: Throwable) {\n    showNewError(message, convertJavaStackTrace(e))\n  }'
          NEW_SHOW_JAVA = 'override fun showNewJavaError(message: String?, e: Throwable?) {\n    showNewError(message, e?.let { convertJavaStackTrace(it) } ?: emptyArray())\n  }'

          if 'override fun showNewJavaError(message: String?, e: Throwable) {' in content:
              content = content.replace(OLD_SHOW_JAVA, NEW_SHOW_JAVA)
              changed = True

          OLD_ASSIGN = '      lastErrorTitle = message\n      lastErrorStack = stack'
          NEW_ASSIGN = '      try {\n        val f1 = DevSupportManagerBase::class.java.getDeclaredField("mLastErrorTitle")\n        f1.isAccessible = true\n        f1.set(this, message)\n      } catch (_: Exception) {}\n      try {\n        val f2 = DevSupportManagerBase::class.java.getDeclaredField("mLastErrorStack")\n        f2.isAccessible = true\n        f2.set(this, stack)\n      } catch (_: Exception) {}'

          if 'lastErrorTitle = message' in content:
              content = content.replace(OLD_ASSIGN, NEW_ASSIGN)
              changed = True

          INSERTION = (
              '  override fun loadSplitBundleFromServer(bundlePath: String, callback: DevSplitBundleCallback) {\n'
              '    fetchSplitBundleAndCreateBundleLoader(\n'
              '      bundlePath,\n'
              '      object : DevSupportManagerBase.CallbackWithBundleLoader {\n'
              '        override fun onSuccess(bundleLoader: JSBundleLoader) {\n'
              '          callback.onSuccess()\n'
              '        }\n'
              '        override fun onError(url: String, cause: Throwable) {\n'
              '          callback.onError(url, cause)\n'
              '        }\n'
              '      })\n'
              '  }\n'
              '\n'
          )

          if 'loadSplitBundleFromServer' not in content:
              old_marker = '  override fun getUniqueTag(): String = "Bridgeless"\n\n  override fun handleReloadJS()'
              new_marker = '  override fun getUniqueTag(): String = "Bridgeless"\n' + INSERTION + '  override fun handleReloadJS()'
              content = content.replace(old_marker, new_marker)
              changed = True

          if changed:
              open(fn, 'w').write(content)
              print('Patched:', fn)
          PYEOF
          find -L node_modules -type f -name "ExpoLogBoxDevSupportManager.kt" \
            -exec python3 /tmp/patch_logbox.py {} \;

      - name: Patch NativeArrayBuffer.cpp to remove tryGetMutableBuffer (RN 0.79 JSI compat)
        run: |
          cat > /tmp/patch_arraybuffer.py << 'PYEOF'
          import sys
          fn = sys.argv[1]
          d = open(fn).read()
          changes = 0

          old1 = '  auto mutableBuffer = arrayBuffer.tryGetMutableBuffer(runtime);\n  if (mutableBuffer) {\n    auto byteBuffer = jni::JByteBuffer::wrapBytes(mutableBuffer->data(), mutableBuffer->size());\n    byteBuffer->order(jni::JByteOrder::nativeOrder());\n    auto value = NativeArrayBuffer::newObjectCxxArgs(byteBuffer, std::move(mutableBuffer));\n    jsiContext->jniDeallocator->addReference(value);\n    return value;\n  }\n\n  size_t size = arrayBuffer.size(runtime);'
          new1 = '  size_t size = arrayBuffer.size(runtime);'
          if old1 in d:
            d = d.replace(old1, new1)
            changes += 1

          old2 = '  auto backingBuffer = typedArray.getBuffer(runtime);\n  auto mutableBuffer = backingBuffer.tryGetMutableBuffer(runtime);\n  if (mutableBuffer) {\n    size_t offset = typedArray.byteOffset(runtime);\n    auto byteBuffer = jni::JByteBuffer::wrapBytes(\n      mutableBuffer->data() + offset, size);\n    byteBuffer->order(jni::JByteOrder::nativeOrder());\n    auto value = NativeArrayBuffer::newObjectCxxArgs(byteBuffer, std::move(mutableBuffer));\n    jsiContext->jniDeallocator->addReference(value);\n    return value;\n  }\n\n  auto byteBuffer = jni::JByteBuffer::allocateDirect(static_cast<jint>(size));'
          new2 = '  auto byteBuffer = jni::JByteBuffer::allocateDirect(static_cast<jint>(size));'
          if old2 in d:
            d = d.replace(old2, new2)
            changes += 1

          if changes > 0:
            open(fn, 'w').write(d)
            print(f'Patched: {fn} ({changes} changes)')
          PYEOF
          find -L node_modules -type f -name "NativeArrayBuffer.cpp" \
            -exec python3 /tmp/patch_arraybuffer.py {} \;

      - name: Patch NativeStatePropsGetter.cpp to remove UpdateMode arg (RN 0.79 updateState takes one arg)
        run: |
          find -L node_modules -type f -name "NativeStatePropsGetter.cpp" \
            -exec sed -i 's/state->updateState(std::move(newState), react::EventQueue::UpdateMode::unstable_Immediate);/state->updateState(std::move(newState));/g' {} \;

      - name: Patch ExpoReactHostFactory for RN 0.79 ReactHost API compat
        run: |
          cat > /tmp/patch_hostfactory.py << 'PYEOF'
          import sys
          fn = sys.argv[1]
          d = open(fn).read()
          changes = 0

          old = '  val reactHostImpl =\n        ReactHostImpl(\n          context,\n          delegate = reactHostDelegate,\n          componentFactory = componentFactory,\n          allowPackagerServerAccess = true,\n          useDevSupport = useDevSupport\n        )'
          new = '  val reactHostImpl =\n        ReactHostImpl(\n          context,\n          reactHostDelegate,\n          componentFactory,\n          true,\n          useDevSupport\n        )'
          if old in d:
            d = d.replace(old, new)
            changes += 1

          # DevSupportManager accessor not available in the AAR's ReactHostImpl;
          # onDidCreateDevSupportManager is a default empty method, safe to skip
          old_call = '        handler.onDidCreateReactHost(context, reactHostImpl)\n        handler.onDidCreateDevSupportManager(reactHostImpl.devSupportManager)'
          new_call = '        handler.onDidCreateReactHost(context, reactHostImpl)'
          if old_call in d:
            d = d.replace(old_call, new_call)
            changes += 1

          if changes > 0:
            open(fn, 'w').write(d)
            print(f'Patched: {fn} ({changes} changes)')
          PYEOF
          find -L node_modules -type f -name "ExpoReactHostFactory.kt" \
            -exec python3 /tmp/patch_hostfactory.py {} \;

      - name: Add missing expo-modules-core filesystem interfaces
        run: |
          # expo-file-system 18.1.11 AAR references interfaces removed in expo-modules-core 57
          # Create stubs so prebuilt AAR classes resolve at runtime
          IFACE_DIR=$(find node_modules -path "*/expo-modules-core/android/src/main/java/expo/modules/interfaces/filesystem" -type d | head -1)
          echo "Creating interface stubs in: $IFACE_DIR"
          cat > "$IFACE_DIR/FilePermissionModuleInterface.kt" << 'IFACE'
          package expo.modules.interfaces.filesystem
          import android.content.Context
          import java.util.EnumSet
          interface FilePermissionModuleInterface {
            fun getPathPermissions(context: Context, path: String): EnumSet<Permission>
          }
          IFACE
          cat > "$IFACE_DIR/AppDirectoriesModuleInterface.kt" << 'IFACE'
          package expo.modules.interfaces.filesystem
          import java.io.File
          interface AppDirectoriesModuleInterface {
            val cacheDirectory: File
            val persistentFilesDirectory: File
          }
          IFACE
          echo "Created: $(ls $IFACE_DIR)"

      - name: Patch expo-modules-core types API for prebuilt AARs (AnyTypeProvider, LazyKType, KType ctors)
        run: |
          # expo-document-picker 13.1.6 / expo-file-system 18.1.11 / expo-image-picker 16.1.4
          # prebuilt AARs are compiled against a newer expo-modules-core that references
          # AnyTypeProvider, LazyKType, AnyType(KType, ...), AnyType.getKType(),
          # ReturnType(KClass), PropertyComponentBuilderWithThis(KType, String),
          # SyncFunctionComponent.setOwnerType(KType) and the IsNotEmpty annotation.
          # Add them to the source-compiled core (57.0.6) so the AAR classes resolve at runtime.
          python3 << 'PYEOF'
          import os
          import sys

          def find_core_dir():
              for root, dirs, files in os.walk('node_modules'):
                  if 'expo-modules-core' in root and 'android/src/main/java/expo/modules/kotlin' in root:
                      return root
              return None

          def write_file(path, content):
              with open(path, 'w') as f:
                  f.write(content)
              print('WROTE:', path)

          def patch_file(path, old, new, replace_all=False):
              with open(path) as f:
                  c = f.read()
              if new in c:
                  print('SKIP (already patched):', path)
                  return
              if old not in c:
                  print('FAIL (pattern not found):', path)
                  sys.exit(1)
              if replace_all:
                  c = c.replace(old, new)
              else:
                  c = c.replace(old, new, 1)
              with open(path, 'w') as f:
                  f.write(c)
              print('PATCHED:', path)

          core = find_core_dir()
          if not core:
              print('FAIL: expo-modules-core kotlin dir not found')
              sys.exit(1)
          print('Core dir:', core)

          write_file(os.path.join(core, 'types', 'AnyTypeProvider.kt'), '''package expo.modules.kotlin.types

          import kotlin.reflect.KClass

          object AnyTypeProvider {
            val typesMap: Map<Pair<KClass<*>, Boolean>, AnyType> = emptyMap()
          }
          ''')

          write_file(os.path.join(core, 'types', 'LazyKType.kt'), '''package expo.modules.kotlin.types

          import kotlin.reflect.KClass
          import kotlin.reflect.KType
          import kotlin.reflect.KTypeProjection

          class LazyKType(
            override val classifier: KClass<*>,
            override val isMarkedNullable: Boolean,
            private val kTypeProvider: () -> KType
          ) : KType {
            override val annotations: List<Annotation>
              get() = kTypeProvider().annotations

            override val arguments: List<KTypeProjection>
              get() = kTypeProvider().arguments
          }
          ''')

          write_file(os.path.join(core, 'records', 'IsNotEmpty.kt'), '''package expo.modules.kotlin.records

          @Target(AnnotationTarget.PROPERTY, AnnotationTarget.FIELD, AnnotationTarget.VALUE_PARAMETER)
          @Retention(AnnotationRetention.RUNTIME)
          annotation class IsNotEmpty
          ''')

          any_type = os.path.join(core, 'types', 'AnyType.kt')
          patch_file(
              any_type,
              '''import expo.modules.kotlin.types.descriptors.TypeDescriptor
          import expo.modules.kotlin.types.descriptors.typeDescriptorOf
          ''',
              '''import expo.modules.kotlin.types.descriptors.TypeDescriptor
          import expo.modules.kotlin.types.descriptors.toTypeDescriptor
          import expo.modules.kotlin.types.descriptors.typeDescriptorOf
          import kotlin.reflect.KType
          '''
          )
          patch_file(
              any_type,
              '''class AnyType(
            val typeDescriptor: TypeDescriptor,
            val converterProvider: TypeConverterProvider? = null
          ) {
          ''',
              '''class AnyType(
            val typeDescriptor: TypeDescriptor,
            val converterProvider: TypeConverterProvider? = null
          ) {
            val kType: KType
              get() = typeDescriptor.kType

            constructor(kType: KType, converterProvider: TypeConverterProvider? = null) : this(
              typeDescriptor = kType.toTypeDescriptor(),
              converterProvider = converterProvider
            )
          '''
          )

          return_type = os.path.join(core, 'types', 'ReturnType.kt')
          patch_file(
              return_type,
              '''import io.github.lukmccall.pika.isIntrospectable
          import kotlin.time.Duration
          ''',
              '''import io.github.lukmccall.pika.isIntrospectable
          import kotlin.reflect.KClass
          import kotlin.time.Duration
          '''
          )
          patch_file(
              return_type,
              '''class ReturnType(
            private val converter: JSTypeConverter<*>
          ) {
          ''',
              '''class ReturnType(
            private val converter: JSTypeConverter<*>
          ) {
            constructor(klass: KClass<*>) : this(
              getDirectConverter(klass.java) ?: getIndirectConverter(klass.java, null)
            )
          '''
          )

          any_function = os.path.join(core, 'functions', 'AnyFunction.kt')
          patch_file(
              any_function,
              '''import expo.modules.kotlin.types.AnyType
          import expo.modules.kotlin.types.descriptors.TypeDescriptor
          ''',
              '''import expo.modules.kotlin.types.AnyType
          import expo.modules.kotlin.types.descriptors.TypeDescriptor
          import expo.modules.kotlin.types.descriptors.toTypeDescriptor
          import kotlin.reflect.KType
          '''
          )
          patch_file(
              any_function,
              '''  @PublishedApi
            internal var ownerType: TypeDescriptor? = null
          ''',
              '''  @PublishedApi
            internal var ownerType: TypeDescriptor? = null

            fun setOwnerType(type: KType) {
              ownerType = type.toTypeDescriptor()
            }
          '''
          )

          prop_builder = os.path.join(core, 'objects', 'PropertyComponentBuilder.kt')
          with open(prop_builder) as f:
              content = f.read()

          if 'val thisType: KType' in content:
              print('SKIP (already patched):', prop_builder)
          else:
              old_class = '''class PropertyComponentBuilderWithThis<ThisType>(
            val thisType: TypeDescriptor,
            name: String
          ) : PropertyComponentBuilder(name) {

            /**
             * Modifier that sets property getter that has caller.
             */
            inline fun <reified R> get(crossinline body: (ThisType) -> R) = apply {
              getter = SyncFunctionComponent("get", arrayOf(AnyType(thisType)), toReturnType<R>()) {
                @Suppress("UNCHECKED_CAST")
                body(it[0] as ThisType)
              }.also {
                it.ownerType = thisType
                it.canTakeOwner = true
              }
            }

            /**
             * Modifier that sets property setter that receives only the new value as an argument.
             */
            inline fun <reified T> set(crossinline body: (self: ThisType, newValue: T) -> Unit) = apply {
              setter = SyncFunctionComponent("set", arrayOf(AnyType(thisType), toAnyType<T>()), toReturnType<Unit>()) {
                @Suppress("UNCHECKED_CAST")
                body(it[0] as ThisType, it[1] as T)
              }.also {
                it.ownerType = thisType
                it.canTakeOwner = true
              }
            }
          }'''
              new_class = '''class PropertyComponentBuilderWithThis<ThisType>(
            val thisType: KType,
            name: String
          ) : PropertyComponentBuilder(name) {

            /**
             * Modifier that sets property getter that has caller.
             */
            inline fun <reified R> get(crossinline body: (ThisType) -> R) = apply {
              getter = SyncFunctionComponent("get", arrayOf(AnyType(thisType)), toReturnType<R>()) {
                @Suppress("UNCHECKED_CAST")
                body(it[0] as ThisType)
              }.also {
                it.setOwnerType(thisType)
                it.canTakeOwner = true
              }
            }

            /**
             * Modifier that sets property setter that receives only the new value as an argument.
             */
            inline fun <reified T> set(crossinline body: (self: ThisType, newValue: T) -> Unit) = apply {
              setter = SyncFunctionComponent("set", arrayOf(AnyType(thisType), toAnyType<T>()), toReturnType<Unit>()) {
                @Suppress("UNCHECKED_CAST")
                body(it[0] as ThisType, it[1] as T)
              }.also {
                it.setOwnerType(thisType)
                it.canTakeOwner = true
              }
            }
          }'''
              if old_class not in content:
                  print('FAIL (class body not found):', prop_builder)
                  sys.exit(1)
              content = content.replace(old_class, new_class, 1)
              old_import = 'import expo.modules.kotlin.types.descriptors.TypeDescriptor\n'
              new_import = 'import expo.modules.kotlin.types.descriptors.toTypeDescriptor\nimport kotlin.reflect.KType\n'
              if old_import in content:
                  content = content.replace(old_import, new_import, 1)
              else:
                  content = content.replace(
                      'import expo.modules.kotlin.types.AnyType\n',
                      'import expo.modules.kotlin.types.AnyType\nimport expo.modules.kotlin.types.descriptors.toTypeDescriptor\nimport kotlin.reflect.KType\n',
                      1
                  )
              with open(prop_builder, 'w') as f:
                  f.write(content)
              print('PATCHED:', prop_builder)

          class_builder = os.path.join(core, 'classcomponent', 'ClassComponentBuilder.kt')
          patch_file(
              class_builder,
              'PropertyComponentBuilderWithThis<SharedObjectType>(ownerType.typeDescriptor, name)',
              'PropertyComponentBuilderWithThis<SharedObjectType>(ownerType.kType, name)',
              replace_all=True
          )

          print('ALL PATCHES APPLIED')
          PYEOF

      - name: Build Android APK
        run: ./gradlew assembleRelease
        working-directory: client/mobile-app/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: client/mobile-app/android/app/build/outputs/apk/release/*.apk

  desktop-linux:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build desktop app (Linux)
        run: pnpm --filter desktop run package:linux
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'ws://localhost:3000' }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: client/desktop/release/dist/*

  desktop-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build desktop app (macOS)
        run: pnpm --filter desktop run package:mac
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'ws://localhost:3000' }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: client/desktop/release/dist/*

  desktop-win:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build desktop app (Windows)
        run: pnpm --filter desktop run package:win
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:3000' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || 'ws://localhost:3000' }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: client/desktop/release/dist/*

  create-release:
    needs: [server, android, desktop-linux, desktop-mac, desktop-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - name: Download release artifacts (skip Docker build artifact)
        run: |
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name apk \
            --name desktop-linux \
            --name desktop-mac \
            --name desktop-win \
            --dir .
        env:
          GH_TOKEN: ${{ github.token }}

      # - name: Generate checksums and create checksums.zip
      #   run: |
      #     mkdir -p checksums
      #     for dir in apk desktop-linux desktop-mac desktop-win; do
      #       if [ -d "$dir" ]; then
      #         find "$dir" -type f -exec sha256sum {} \; | sed "s|  $dir/|  |" > "checksums/$dir.sha256"
      #       fi
      #     done
      #     (cd checksums && zip -r9 ../checksums.zip .)
      #     rm -rf checksums

      - name: Collect blockmap files and create blockmaps.zip
        run: |
          mkdir -p blockmaps
          for dir in desktop-linux desktop-mac desktop-win; do
            if [ -d "$dir" ]; then
              find "$dir" -name "*.blockmap" -type f -exec mv {} blockmaps/ \;
            fi
          done
          (cd blockmaps && zip -r9 ../blockmaps.zip .)
          rm -rf blockmaps
          # Remove individual blockmap + SHA256SUMS from desktop dirs so they don't upload separately
          for dir in desktop-linux desktop-mac desktop-win; do
            [ -d "$dir" ] && rm -f "$dir"/*.blockmap "$dir"/SHA256SUMS
          done

      - name: Generate release notes
        id: release_notes
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            NOTES=$(git log --oneline --no-decorate -20)
          else
            NOTES=$(git log --oneline --no-decorate "${PREVIOUS_TAG}..HEAD")
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | od -A n -t x | tr -d ' \n')
          echo "notes<<$EOF" >> "$GITHUB_OUTPUT"
          echo "## Changes" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: true
          files: |
            apk/*.apk
            desktop-linux/*
            desktop-mac/*
            desktop-win/*
            blockmaps.zip
