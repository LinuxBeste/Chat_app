name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Lowercase repo
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - run: pnpm install
      - run: pnpm --filter server run build
      - run: pnpm --filter web run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/server:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LOWER }}/server:latest

  create-release:
    needs: [android, desktop-linux, desktop-mac, desktop-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release_notes
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "## Changes" >> $GITHUB_OUTPUT
          git log --oneline --no-decorate $(git tag --sort=-creatordate | head -2 | tail -1)..$(git tag --sort=-creatordate | head -1) 2>/dev/null || git log --oneline --no-decorate -20 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: true

  android:
    needs: server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - run: pnpm install

      - name: Generate native projects
        run: npx expo prebuild --clean
        working-directory: client/mobile-app
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://10.0.2.2:3000' }}

      - name: Build Android APK
        run: ./gradlew assembleRelease
        working-directory: client/mobile-app/android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://10.0.2.2:3000' }}

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: client/mobile-app/android/app/build/outputs/apk/release/*.apk

  desktop-linux:
    needs: server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build desktop app (Linux)
        run: pnpm --filter desktop run package:linux
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://localhost:3000' }}

      - name: Upload Linux artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/desktop/release/dist/*
            client/desktop/release/ChatApp-*.zip

  desktop-mac:
    needs: server
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build desktop app (macOS)
        run: pnpm --filter desktop run package:mac
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://localhost:3000' }}

      - name: Upload macOS artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/desktop/release/dist/*
            client/desktop/release/ChatApp-*.zip

  desktop-win:
    needs: server
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Build desktop app (Windows)
        run: pnpm --filter desktop run package:win
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://localhost:3000' }}

      - name: Upload Windows artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/desktop/release/dist/*
            client/desktop/release/ChatApp-*.zip
